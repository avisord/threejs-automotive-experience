<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="0.5" stop-color="#b9c1cd"/>
      <stop offset="1" stop-color="#6d7686"/>
    </linearGradient>
    <radialGradient id="tyre" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.72" stop-color="#262a32"/>
      <stop offset="1" stop-color="#0d0f13"/>
    </radialGradient>
  </defs>
  <!-- tyre, outlined so it reads on a dark tab bar -->
  <circle cx="32" cy="32" r="30.5" fill="url(#tyre)" stroke="#5b6475" stroke-width="1.5"/>
  <!-- rim lip and the dark barrel behind the spokes -->
  <circle cx="32" cy="32" r="22.5" fill="url(#metal)"/>
  <circle cx="32" cy="32" r="19.5" fill="#15181e"/>
  <!-- brake caliper, the app's accent -->
  <path d="M15.2 26.5 A17.5 17.5 0 0 1 26.5 15.2 L28 19.4 A13 13 0 0 0 19.4 28 Z" fill="#35e0ff"/>
  <!-- five tapered spokes -->
  <g fill="url(#metal)">
    <path id="spoke" d="M29.2 30 L27.4 13.2 Q32 12 36.6 13.2 L34.8 30 Z"/>
    <use href="#spoke" transform="rotate(72 32 32)"/>
    <use href="#spoke" transform="rotate(144 32 32)"/>
    <use href="#spoke" transform="rotate(216 32 32)"/>
    <use href="#spoke" transform="rotate(288 32 32)"/>
  </g>
  <!-- hub and centre cap -->
  <circle cx="32" cy="32" r="7" fill="url(#metal)"/>
  <circle cx="32" cy="32" r="3.6" fill="#35e0ff"/>
</svg>
